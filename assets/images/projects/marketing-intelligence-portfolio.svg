<svg xmlns="http://www.w3.org/2000/svg" width="800" viewBox="0 0 800 400" role="img">
<title>Marketing Intelligence Score Portfolio</title>
<desc>Eight production scores across four decision layers — Economic Value, Member State, Action Selection and Outreach Activation — synthesized into one Expected Value score that ranks members for outreach.</desc>
