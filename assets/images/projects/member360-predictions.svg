<svg xmlns="http://www.w3.org/2000/svg" width="800" viewBox="0 0 800 390" role="img">
<title>Unified Predictions Platform / Member360 data flow</title>
<desc>Fragmented per-system member data is consolidated through Verato-based identity resolution with two-level SCD2 history into one prediction store, served to clinicians and downstream applications.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a73"/></marker>
</defs>
<text x="400" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1a2b3c">Unified Predictions Platform / Member360</text>
<text x="400" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5a6b7c">one member identity → one prediction store → every team</text>
<rect x="8" y="64" width="240" height="140" rx="10" fill="#ffffff" stroke="#3d5a73" stroke-width="2"/>
<text x="128" y="94" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2b3c">Fragmented sources</text>
<text x="128" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5a6a">per-system member data</text>
<text x="128" y="138" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5a6a">clinical · product</text>
<text x="128" y="158" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5a6a">marketing</text>
<rect x="264" y="64" width="264" height="140" rx="10" fill="#ffffff" stroke="#3d5a73" stroke-width="2"/>
<text x="396" y="94" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2b3c">Identity resolution</text>
<text x="396" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5a6a">Verato-based Global ID</text>
<text x="396" y="138" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5a6a">two-level SCD2</text>
<rect x="544" y="64" width="248" height="140" rx="10" fill="#ffffff" stroke="#3d5a73" stroke-width="2"/>
<text x="668" y="94" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1a2b3c">Prediction store</text>
<text x="668" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5a6a">registry · SCD2 history</text>
<text x="668" y="138" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5a6a">UUID-v5 · Lakeflow</text>
<text x="668" y="158" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#4a5a6a">streaming + mat. views</text>
<line x1="248" y1="134" x2="260" y2="134" stroke="#3d5a73" stroke-width="2" marker-end="url(#a)"/>
<line x1="528" y1="134" x2="540" y2="134" stroke="#3d5a73" stroke-width="2" marker-end="url(#a)"/>
<rect x="8" y="220" width="784" height="52" rx="10" fill="#f0f4f8" stroke="#3d5a73" stroke-width="2"/>
<text x="400" y="251" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#1a2b3c">SHAP batch scoring → self-serve member insights (Power BI)</text>
<rect x="8" y="288" width="220" height="36" rx="18" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="118" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#145a25">10,000 clinicians</text>
<rect x="240" y="288" width="300" height="36" rx="18" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="390" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#145a25">50+ downstream APIs &amp; apps</text>
<rect x="552" y="288" width="240" height="36" rx="18" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="672" y="311" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#145a25">replaces siloed data</text>
<text x="400" y="356" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#5a6b7c">Snowflake · Databricks (Lakeflow, Unity Catalog, MLflow) · SHAP · dbt</text>
</svg>
