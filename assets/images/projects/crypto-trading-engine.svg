<text x="400" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5a6b7c">X.com + multi-provider feeds → real-time predictions</text>
