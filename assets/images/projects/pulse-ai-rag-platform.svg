<svg xmlns="http://www.w3.org/2000/svg" width="800" viewBox="0 0 800 400" role="img">
<title>PULSE AI Health Scoring Platform architecture</title>
<desc>Flow from the Snowflake Gold layer through LangChain, LlamaIndex and Pinecone retrieval into a HIPAA-compliant LLM, which writes back governed health scores. An evaluation layer tracks confidence, groundedness, calibration, drift and feature attributions.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d5a73"/></marker>
</defs>
<text x="400" y="28" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1a2b3c">PULSE AI Health Scoring Platform</text>
<text x="400" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5a6b7c">RAG platform: Snowflake Gold → HIPAA-compliant LLM → governed scores</text>
